<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Môle 4 — Port de Dunkerque</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ocean:#003D6B;
  --ocean-mid:#1A6FBF;
  --ocean-light:#4A9FEF;
  --sand:#F7F3ED;
  --sand2:#EDE8E0;
  --sand3:#DDD7CB;
  --rust:#D4541E;
  --lime:#2DBF6A;
  --amber:#F4A024;
  --violet:#7B3FA0;
  --teal:#0FA89A;
  --text:#12202E;
  --text2:#5A6B7B;
  --text3:#9AABBA;
  --border:rgba(0,61,107,0.10);
  --border2:rgba(0,61,107,0.20);
  --radius:10px;
  --radius-lg:16px;
  --shadow:0 2px 12px rgba(0,61,107,0.08);
  --shadow-md:0 6px 24px rgba(0,61,107,0.12);
  --font-display:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --ocean:#0A2A45;
  --ocean-mid:#1A6FBF;
  --ocean-light:#4A9FEF;
  --sand:#131E28;
  --sand2:#1C2D3A;
  --sand3:#253344;
  --text:#E8F0F8;
  --text2:#8AACCA;
  --text3:#4A6880;
  --border:rgba(74,159,239,0.12);
  --border2:rgba(74,159,239,0.22);
  --shadow:0 2px 12px rgba(0,0,0,0.3);
  --shadow-md:0 6px 24px rgba(0,0,0,0.4);
}}

body{
  font-family:var(--font-body);
  background:var(--sand);
  color:var(--text);
  font-size:14px;
  line-height:1.6;
}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sidebar{
  width:230px;min-width:230px;
  background:var(--ocean);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  box-shadow:4px 0 20px rgba(0,61,107,0.25);
}
.sb-logo{
  padding:24px 18px 18px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,transparent 100%);
}
.sb-logo-badge{
  display:inline-block;
  font-size:9px;font-weight:700;letter-spacing:2px;
  color:rgba(255,255,255,0.5);text-transform:uppercase;
  margin-bottom:8px;
}
.sb-logo span{
  font-family:var(--font-display);
  font-size:20px;font-weight:800;color:#fff;
  display:block;letter-spacing:-0.5px;line-height:1.1;
}
.sb-logo small{font-size:11px;color:rgba(255,255,255,0.55);margin-top:3px;display:block}

nav{flex:1;padding:10px 0}

.nav-section-label{
  font-size:9px;font-weight:700;letter-spacing:2px;
  color:rgba(255,255,255,0.3);text-transform:uppercase;
  padding:14px 18px 4px;
}

.nav-btn{
  width:100%;background:none;border:none;
  padding:9px 14px;display:flex;align-items:center;gap:10px;
  cursor:pointer;color:rgba(255,255,255,0.65);
  font-family:var(--font-body);font-size:13px;font-weight:500;text-align:left;
  border-left:3px solid transparent;
  transition:all 0.2s;
}
.nav-btn:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav-btn.active{
  background:rgba(255,255,255,0.12);color:#fff;font-weight:600;
  border-left-color:var(--ocean-light);
}
.nav-icon{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.nav-sub{padding-left:52px;display:none}
.nav-sub.open{display:block}
.nav-sub a{
  display:block;padding:5px 10px;font-size:12px;
  color:rgba(255,255,255,0.45);cursor:pointer;border-radius:6px;
  transition:all 0.15s;
}
.nav-sub a:hover{color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.07)}

.sb-footer{
  padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);
  font-size:10px;color:rgba(255,255,255,0.35);
  letter-spacing:0.5px;
}
.sb-footer strong{display:block;color:rgba(255,255,255,0.5);font-size:11px;margin-bottom:2px}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:24px 28px;background:var(--sand)}
.section{display:none}
.section.active{display:block;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── HEADER BLOCK ── */
.header-block{
  background:linear-gradient(135deg,var(--ocean) 0%,var(--ocean-mid) 100%);
  border-radius:var(--radius-lg);
  padding:28px 28px 24px;
  margin-bottom:24px;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-md);
}
.header-block::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:200px;height:200px;
  background:rgba(255,255,255,0.04);
  border-radius:50%;
}
.header-block::after{
  content:'';position:absolute;bottom:-60px;right:60px;
  width:140px;height:140px;
  background:rgba(255,255,255,0.03);
  border-radius:50%;
}
.header-tag{
  font-size:10px;font-weight:700;letter-spacing:2.5px;
  color:var(--ocean-light);text-transform:uppercase;
  margin-bottom:10px;
}
.header-block h1{
  font-family:var(--font-display);
  font-size:26px;font-weight:800;color:#fff;
  letter-spacing:-0.5px;line-height:1.15;margin-bottom:8px;
}
.header-block p{font-size:13px;color:rgba(255,255,255,0.6);font-weight:400}
.header-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.header-chip{
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:20px;padding:4px 12px;
  font-size:11px;color:rgba(255,255,255,0.85);font-weight:500;
}

/* ── SECTION HEADER ── */
.sec-header{
  display:flex;align-items:flex-start;gap:16px;
  margin-bottom:20px;padding:18px 20px;
  background:var(--sand2);
  border-radius:var(--radius-lg);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.sec-num{
  font-family:var(--font-display);
  font-size:42px;font-weight:800;
  color:var(--border2);line-height:1;min-width:54px;
}
.sec-tag{
  display:inline-block;padding:3px 12px;
  border-radius:20px;font-size:10px;font-weight:700;
  margin-bottom:6px;color:#fff;letter-spacing:0.5px;
  text-transform:uppercase;
}
.sec-title{
  font-family:var(--font-display);
  font-size:19px;font-weight:700;color:var(--text);
}
.sec-desc{font-size:12px;color:var(--text2);margin-top:3px}

/* ── KPI STRIP ── */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.kpi-item{
  background:var(--sand2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px 12px;text-align:center;
  box-shadow:var(--shadow);transition:transform 0.2s;
}
.kpi-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi-val{font-family:var(--font-display);font-size:22px;font-weight:800}
.kpi-label{font-size:10px;color:var(--text2);margin-top:3px;font-weight:500;letter-spacing:0.3px}

/* ── CARDS GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{
  background:var(--sand2);border:1px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--shadow);transition:box-shadow 0.2s;
}
.card:hover{box-shadow:var(--shadow-md)}
.card-stripe{height:4px}
.banner{
  height:145px;background:var(--sand3);cursor:pointer;
  position:relative;display:flex;align-items:center;
  justify-content:center;overflow:hidden;
}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner-placeholder{text-align:center;color:var(--text3)}
.banner-placeholder i{font-size:32px;display:block;margin-bottom:6px;opacity:0.6}
.banner-placeholder p{font-size:11px;font-weight:500}
.banner-tag{
  position:absolute;top:10px;left:10px;
  padding:3px 10px;border-radius:20px;
  font-size:10px;color:#fff;font-weight:700;letter-spacing:0.5px;
  backdrop-filter:blur(4px);
}
.banner-num{
  position:absolute;top:10px;right:10px;
  background:rgba(0,0,0,0.5);color:#fff;
  padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;
}
.banner-change{
  position:absolute;bottom:10px;right:10px;
  background:rgba(0,0,0,0.6);color:#fff;border:none;
  padding:5px 10px;border-radius:8px;font-size:10px;cursor:pointer;
  display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px);
  transition:background 0.2s;
}
.banner-change:hover{background:rgba(0,0,0,0.8)}
.card-body{padding:14px}
.card-title{
  font-family:var(--font-display);
  font-size:13px;font-weight:700;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  color:var(--text);
}
.card-content{
  display:none;font-size:12px;line-height:1.7;color:var(--text2);
  margin-top:10px;padding-top:10px;border-top:1px solid var(--border);
}
.card.open .card-content{display:block}

/* ── FINANCE CARDS ── */
.finance-card{
  background:var(--sand2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.finance-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.finance-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.finance-label{font-size:10px;color:var(--text2);font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.finance-title{font-family:var(--font-display);font-size:15px;font-weight:700}
.finance-amount{
  font-family:var(--font-display);
  font-size:32px;font-weight:800;
  color:var(--text);margin:6px 0;
}
.finance-sub{font-size:11px;color:var(--text2);margin-bottom:10px}
.finance-items{padding-left:16px;font-size:12px;color:var(--text2);line-height:2}
.bar{height:8px;background:var(--sand3);border-radius:4px;margin-top:12px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease}

/* ── PHASE CARDS ── */
.phase-timeline{border-left:2px solid var(--border2);margin-left:8px}
.phase-card{
  background:var(--sand2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px 18px 18px 22px;
  margin-bottom:14px;position:relative;
  box-shadow:var(--shadow);margin-left:14px;
}
.phase-dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--ocean-mid);
  position:absolute;left:-23px;top:22px;
  border:3px solid var(--sand);
  box-shadow:0 0 0 2px var(--ocean-mid);
}
.phase-num{
  font-size:9px;font-weight:700;
  color:var(--ocean-light);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;
}
.phase-title{font-family:var(--font-display);font-size:16px;font-weight:700}
.phase-years{
  font-size:12px;color:var(--text2);margin-bottom:12px;
  font-weight:500;
}
.phase-tasks{padding-left:0;list-style:none;font-size:12px;color:var(--text2);line-height:2}

/* ── ENERGY CARDS ── */
.energy-card{
  background:var(--sand2);border:1px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--shadow);
}
.energy-head{display:flex;align-items:center;gap:12px;padding:14px 14px 0}
.energy-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.energy-title{font-family:var(--font-display);font-size:14px;font-weight:700}
.energy-sub{font-size:11px;color:var(--text2);font-weight:500}
.energy-val{
  font-family:var(--font-display);
  font-size:28px;font-weight:800;padding:10px 14px 0;color:var(--text);
}
.energy-points{
  padding:8px 14px 14px 28px;
  font-size:11px;color:var(--text2);line-height:1.9;
}

/* ── ODD GRID ── */
.odd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.odd-card{
  border-radius:var(--radius-lg);padding:16px;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
}
.odd-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,0.2)}
.odd-badge{font-size:9px;font-weight:700;color:rgba(255,255,255,0.7);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}
.odd-num{font-family:var(--font-display);font-size:42px;font-weight:800;color:rgba(255,255,255,0.2);line-height:1}
.odd-icon{font-size:24px;display:block;margin:6px 0}
.odd-title{font-family:var(--font-display);font-size:13px;font-weight:700;color:#fff;margin-bottom:5px}
.odd-desc{display:none;font-size:11px;color:rgba(255,255,255,0.88);line-height:1.65}
.odd-card.open .odd-desc{display:block}
.odd-card.open .odd-num{display:none}

/* ── MOB KPI ── */
.mob-kpi{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mob-kpi-item{
  background:var(--sand3);border-radius:8px;
  padding:7px 12px;text-align:center;border:1px solid var(--border);
}
.mob-kpi-val{font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--text)}
.mob-kpi-label{font-size:10px;color:var(--text2);font-weight:500}

/* ── LIGHTBOX ── */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:999;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.lightbox.active{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:12px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.lb-close{
  position:fixed;top:20px;right:20px;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);
  color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;
  font-size:20px;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);transition:background 0.2s;
}
.lb-close:hover{background:rgba(255,255,255,0.25)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--ocean);color:#fff;
  border:1px solid rgba(255,255,255,0.15);
  padding:10px 20px;border-radius:24px;font-size:12px;font-weight:500;
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index:1000;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── BUDGET OVERVIEW ── */
.budget-overview{
  background:linear-gradient(135deg,var(--ocean) 0%,#1A5FA0 100%);
  border-radius:var(--radius-lg);padding:20px;
  margin-bottom:14px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-md);
}
.budget-overview::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:150px;height:150px;background:rgba(255,255,255,0.04);border-radius:50%;
}
.budget-label{font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-bottom:4px}
.budget-amount{font-family:var(--font-display);font-size:40px;font-weight:800;color:#fff;line-height:1}
.budget-sub{font-size:11px;color:rgba(255,255,255,0.5);margin-top:4px;margin-bottom:16px}
.budget-legend{display:flex;flex-direction:column;gap:5px}
.budget-legend-row{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.budget-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.budget-legend-label{color:rgba(255,255,255,0.8);display:flex;align-items:center;gap:7px;flex:1}
.budget-legend-val{font-weight:700;color:#fff}
.budget-bar-track{height:12px;background:rgba(255,255,255,0.15);border-radius:6px;margin-top:14px;overflow:hidden}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .sidebar{width:56px;min-width:56px}
  .sb-logo span,.sb-logo small,.sb-logo-badge,.nav-btn span:not(.nav-icon),.nav-sub,.sb-footer,.nav-section-label{display:none}
  .nav-btn{justify-content:center;padding:12px}
  .kpi-strip{grid-template-columns:repeat(3,1fr)}
  .odd-grid{grid-template-columns:1fr 1fr}
  .main{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-badge">Port de Dunkerque</div>
      <span>MÔLE 4</span>
      <small>Projet Urbain 2025–2032</small>
    </div>
    <nav id="nav"></nav>
    <div class="sb-footer">
      <strong>Môle 4</strong>
      Poster interactif · v2025
    </div>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt="">
</div>
<div class="toast" id="toast"></div>

<script>
const NAV=[
  {n:1,icon:'🏙️',label:"Vue d'ensemble",color:'rgba(212,84,30,0.25)',sub:[
    {icon:'🗺️',label:'Vue générale',el:'b1'},{icon:'🏠',label:'Habitat & Services',el:'b2'},
    {icon:'🌿',label:'Parc',el:'b3'},{icon:'🏥',label:'Pôle Médical',el:'b4'},{icon:'🎓',label:'Formation',el:'b5'}
  ]},
  {n:2,icon:'💰',label:'Financement',color:'rgba(26,111,191,0.25)',sub:[
    {icon:'🇪🇺',label:'FEDER / Interreg',el:'f1'},{icon:'🏛️',label:'Collectivités',el:'f2'},
    {icon:'🏗️',label:'Privé',el:'f3'},{icon:'🌿',label:'Fonds verts',el:'f4'}
  ]},
  {n:3,icon:'🔨',label:'Réaménagement',color:'rgba(45,191,106,0.25)',sub:[
    {icon:'📅',label:'Phase 1',el:'ph1'},{icon:'📅',label:'Phase 2',el:'ph2'},{icon:'📅',label:'Phase 3',el:'ph3'}
  ]},
  {n:4,icon:'🚌',label:'Accès & Mobilités',color:'rgba(123,63,160,0.25)',sub:[
    {icon:'🚌',label:'Transport',el:'m1'},{icon:'🚲',label:'Mobilités douces',el:'m2'},{icon:'🚗',label:'Stationnement',el:'m3'}
  ]},
  {n:5,icon:'⚡',label:'Énergie',color:'rgba(244,160,36,0.25)',sub:[
    {icon:'🌊',label:'Houlomotrice',el:'e1'},{icon:'♻️',label:'Réduction',el:'e2'},
    {icon:'🔗',label:'Innovation',el:'e3'},{icon:'🚰',label:'Traitement eau',el:'e4'}
  ]},
  {n:6,icon:'🌍',label:'ODD',color:'rgba(15,168,154,0.25)',sub:[]}
];

let activeSection=1,openSubs=new Set([1]),openBlocks=new Set(),openOdds=new Set(),images={},toastTimer=null;

function loadImages(){try{const s=localStorage.getItem('mole4-images');if(s)images=JSON.parse(s);}catch(e){}}
function saveImages(){try{localStorage.setItem('mole4-images',JSON.stringify(images));}catch(e){}}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function openLightbox(src){document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('active');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active');}
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});

function handleFile(id,file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{images[id]=ev.target.result;saveImages();showToast('Photo sauvegardée ✓');renderAll();};
  reader.readAsDataURL(file);
}

function makeBanner(id,tag,tagColor,num,style=''){
  const hasImg=!!images[id];
  return `<div class="banner" style="${style}" onclick="bannerClick('${id}')">
    ${hasImg
      ?`<img src="${images[id]}" alt=""><button class="banner-change" onclick="event.stopPropagation();document.getElementById('fi-${id}').click()"><i class="ti ti-upload" style="font-size:11px"></i> Changer</button>`
      :`<div class="banner-placeholder"><i class="ti ti-photo-plus"></i><p>Ajouter une photo</p></div>`}
    ${tag?`<span class="banner-tag" style="background:${tagColor}">${tag}</span>`:''}
    ${num?`<span class="banner-num">${num}</span>`:''}
    <input type="file" accept="image/*" id="fi-${id}" style="display:none" onchange="handleFile('${id}',this.files[0])">
  </div>`;
}

function bannerClick(id){if(images[id])openLightbox(images[id]);else document.getElementById('fi-'+id).click();}
function showSection(n){activeSection=n;openSubs=new Set([n]);renderAll();document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});}
function scrollToEl(id){setTimeout(()=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},100);}
function toggleBlock(id){openBlocks.has(id)?openBlocks.delete(id):openBlocks.add(id);renderAll();}
function toggleOdd(idx){openOdds.has(idx)?openOdds.delete(idx):openOdds.add(idx);renderAll();}

function renderNav(){
  document.getElementById('nav').innerHTML=`<div class="nav-section-label">Sections</div>`+NAV.map(item=>`
    <div>
      <button class="nav-btn ${activeSection===item.n?'active':''}" onclick="showSection(${item.n})">
        <span class="nav-icon" style="background:${item.color}">${item.icon}</span>
        <span style="flex:1">${item.label}</span>
        ${item.sub.length?`<i class="ti ti-chevron-${openSubs.has(item.n)?'up':'down'}" style="font-size:12px;color:rgba(255,255,255,0.35)"></i>`:''}
      </button>
      <div class="nav-sub ${openSubs.has(item.n)?'open':''}">
        ${item.sub.map(s=>`<a onclick="showSection(${item.n});scrollToEl('${s.el}')">${s.icon} ${s.label}</a>`).join('')}
      </div>
    </div>`).join('');
}
